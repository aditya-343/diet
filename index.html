<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diet Plan Generator</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="theme-toggle">
    <i class="fas fa-sun" id="theme-icon"></i>
  </div>
  <div class="container">
    <h1>Diet Plan Generator</h1>
    <form id="mealPlanForm">
      <label for="calories">Daily Calorie Target:</label>
      <input type="number" id="calories" placeholder="e.g., 2000" required>

      <label for="diet">Diet Type:</label>
      <select id="diet" required>
        <option value="">Select Diet Type</option>
        <option value="vegetarian">Vegetarian</option>
        <option value="vegan">Vegan</option>
        <option value="ketogenic">Keto</option>
        <option value="gluten free">Gluten Free</option>
        <option value="paleo">Paleo</option>
      </select>

      <button type="submit">Generate Meal Plan</button>
    </form>

    <div id="mealPlan" class="meal-plan"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
